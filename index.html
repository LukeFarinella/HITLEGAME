<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GORGON // SENTINEL C2</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
  </head>
  <body>
    <!-- Cesium mounts the continuous globe here -->
    <div id="cesiumContainer"></div>

    <!-- GORGON tactical overlay -->
    <div id="globe-ui">
      <div class="g-status">
        <span class="live"><span class="dot"></span>GORGON // SENTINEL C2</span>
        <span id="g-mode">ORBITAL · SELECT THEATER</span>
      </div>

      <div class="g-title" id="g-title">
        <span class="eyebrow">Select Operating Theater</span>
        <h1 class="wordmark">G<b>O</b>RGON</h1>
      </div>

      <div class="g-readout">
        <div class="row"><span class="k">Cursor Lat</span><span class="v" id="g-lat">—</span></div>
        <div class="row"><span class="k">Cursor Lon</span><span class="v" id="g-lon">—</span></div>
        <div class="row"><span class="k">Theater</span><span class="v">200 MI Ø</span></div>
        <div class="row"><span class="k">Terrain</span><span class="v" id="g-terrain">loading…</span></div>
        <div class="row"><span class="k">Obelisks</span><span class="v" id="g-obelisks">loading…</span></div>
        <div class="row"><span class="k">Roads</span><span class="v" id="g-roads">—</span></div>
        <div class="row"><span class="k">Buildings</span><span class="v" id="g-buildings">—</span></div>
        <div class="row"><span class="k">Units</span><span class="v" id="g-units">0</span></div>
        <div class="row"><span class="k">Selected</span><span class="v" id="g-selected">0</span></div>
      </div>

      <button id="g-exit" type="button" hidden>◀ WORLD MAP</button>

      <div class="g-hint" id="g-hint">
        <span class="mouse"><b>DRAG</b> orbit &nbsp;·&nbsp; <b>WHEEL</b> zoom &nbsp;·&nbsp; <b>CLICK</b> select 200mi theater</span>
        <span class="touch"><b>DRAG</b> orbit &nbsp;·&nbsp; <b>PINCH</b> zoom &nbsp;·&nbsp; <b>TAP</b> select theater</span>
      </div>
    </div>

    <script type="module" src="/src/cesium/gorgonGlobe.ts"></script>
  </body>
</html>
