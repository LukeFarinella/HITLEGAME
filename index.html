<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GORGON // SENTINEL C2</title>
    <link rel="stylesheet" href="/src/ui/theme.css" />
  </head>
  <body>
    <!-- Cesium mounts the continuous globe here -->
    <div id="cesiumContainer"></div>

    <!-- GORGON tactical overlay -->
    <div id="globe-ui">
      <div class="g-status">
        <span class="live"><span class="dot"></span>GORGON // SENTINEL C2</span>
        <span id="g-mode">ORBITAL · SELECT THEATER</span>
      </div>

      <div class="g-title" id="g-title">
        <span class="eyebrow">Select Operating Theater</span>
        <h1 class="wordmark">G<b>O</b>RGON</h1>
      </div>

      <!-- Cursor readout only in orbit, to aim the theater pick -->
      <div class="g-cursor" id="g-cursor">
        <span id="g-lat">—</span><span class="sep">/</span><span id="g-lon">—</span>
      </div>

      <button id="g-exit" type="button" hidden>◀ WORLD MAP</button>
    </div>

    <!-- Single-unit selection panel (theater) -->
    <div id="unit-panel" hidden>
      <div class="up-head">
        <span class="up-dot" id="up-dot"></span>
        <span class="up-id" id="up-id">—</span>
        <button class="up-close" id="up-close" type="button" aria-label="Deselect">✕</button>
      </div>
      <div class="up-body">
        <div class="up-row"><span class="k">Type</span><span class="v" id="up-type">—</span></div>
        <div class="up-row"><span class="k">Status</span><span class="v" id="up-status">—</span></div>
        <div class="up-row"><span class="k">Position</span><span class="v" id="up-pos">—</span></div>
        <div class="up-row"><span class="k">Heading</span><span class="v" id="up-hdg">—</span></div>
        <div class="up-row"><span class="k">Sensor</span><span class="v" id="up-sensor">—</span></div>
      </div>
    </div>

    <!-- Reticle that tracks the selected unit on screen -->
    <div id="unit-reticle" hidden><i></i><i></i><i></i><i></i></div>

    <script type="module" src="/src/cesium/gorgonGlobe.ts"></script>
  </body>
</html>
