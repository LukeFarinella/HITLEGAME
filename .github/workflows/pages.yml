# Publish the playable build to GitHub Pages.
#
# This is possible at all because the app has no server-side component: AWS enabled CORS on the
# terrain bucket, so tiles are fetched straight from S3 (see terrariumTileUrl) and `dist/` is a
# plain static bundle. Before that it needed a tile proxy and a static host was not an option.
#
# VITE_BASE is set because a project site is served from a subpath, not the domain root.
name: Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # NEEDS ONE MANUAL STEP FIRST: Settings -> Pages -> Source: "GitHub Actions".
      #
      # `enablement: true` asks this action to switch Pages on by itself, and it cannot: the default
      # GITHUB_TOKEN is refused on the create-a-Pages-site endpoint ("Resource not accessible by
      # integration"), no matter what `permissions:` declares. It stays set because once Pages IS on
      # the action finds the existing site and never calls create — so this is a no-op then, not a
      # thing to remove later.
      #
      # Also note Pages on a PRIVATE repo requires a paid plan (Pro/Team/Enterprise). On a free
      # account this workflow cannot publish until the repo is public — Cloudflare Pages has no such
      # restriction and needs no config beyond a static build, which is what dist/ now is.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}

      # vite-plugin-cesium joins Vite's `base` into BOTH the asset URL and its copy destination, so a
      # subpath build lands the Cesium payload at dist/<base>/cesium while index.html asks for
      # <base>/cesium — which on a project site resolves to dist/cesium. Hoist it, and fail loudly
      # rather than deploying a site whose globe engine 404s.
      - name: Hoist Cesium out of the duplicated base prefix
        run: |
          found=$(find dist -mindepth 2 -maxdepth 2 -type d -name cesium | head -1)
          if [ -n "$found" ]; then
            mv "$found" dist/cesium
            rmdir "$(dirname "$found")" 2>/dev/null || true
          fi
          test -f dist/cesium/Cesium.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deploy
